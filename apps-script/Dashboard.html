<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #F5F3EE; --surface: #FBFAF7; --sunken: #ECE9E1; --hover: #E9E6DE;
    --ink: #0B0B12; --ink-soft: #3E3C4A; --muted: #5A5866;
    --line: #DAD6CC; --line-strong: #0B0B12;
    --accent: #4004D4; --on-accent: #FFFFFF; --accent-text: #4004D4;
    --accent-tint: #E9E4FD; --accent-tint-text: #3A06B8;
    --coral: #E8794A; --warn-text: #C2410C; --warn-tint: #FDE8DC;
    --good-text: #146B50; --good-tint: #DCF4EC;
    --bar-track: #E3DFD5; --focus: #4004D4; --scroll-thumb: #C8C3B7; --scroll-thumb-hover: #8F8B80;
    color-scheme: light;
    --scrim: rgba(11, 11, 18, 0.42); --toast-bg: #0B0B12; --toast-fg: #F5F3EE;
    --font: 'Inter Tight', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.2, 0, 0, 1); --fast: 240ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0B12; --surface: #12121B; --sunken: #181823; --hover: #1E1E2A;
      --ink: #F5F3EE; --ink-soft: #CFCDD9; --muted: #A9A7B8;
      --line: #2B2A37; --line-strong: #F5F3EE;
      --accent: #5B24F0; --on-accent: #FFFFFF; --accent-text: #B9A8FA;
      --accent-tint: #1F1840; --accent-tint-text: #D3C9FB;
      --warn-text: #FDBA74; --warn-tint: #33190D; --good-text: #7FD8B4; --good-tint: #0F2A20;
      --bar-track: #262533; --focus: #B9A8FA; --scroll-thumb: #34333F; --scroll-thumb-hover: #5A5868;
      --scrim: rgba(0, 0, 0, 0.6); --toast-bg: #F5F3EE; --toast-fg: #0B0B12;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0B12; --surface: #12121B; --sunken: #181823; --hover: #1E1E2A;
    --ink: #F5F3EE; --ink-soft: #CFCDD9; --muted: #A9A7B8;
    --line: #2B2A37; --line-strong: #F5F3EE;
    --accent: #5B24F0; --on-accent: #FFFFFF; --accent-text: #B9A8FA;
    --accent-tint: #1F1840; --accent-tint-text: #D3C9FB;
    --warn-text: #FDBA74; --warn-tint: #33190D; --good-text: #7FD8B4; --good-tint: #0F2A20;
    --bar-track: #262533; --focus: #B9A8FA; --scroll-thumb: #34333F; --scroll-thumb-hover: #5A5868;
    --scrim: rgba(0, 0, 0, 0.6); --toast-bg: #F5F3EE; --toast-fg: #0B0B12;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Thin scrollbars in the theme's colours, instead of the heavy system ones */
  html { scrollbar-color: var(--scroll-thumb) transparent; }
  html, .side, .queue-list, .detail, .drawer, .table-wrap, .board-wrap, .modal-card, textarea { scrollbar-width: thin; }
  .queue-list:hover, .detail:hover, .drawer:hover, .table-wrap:hover, .board-wrap:hover, textarea:hover { scrollbar-color: var(--scroll-thumb-hover) transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-text); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::selection { background: var(--accent); color: var(--on-accent); }

  .mono, .label { font-family: var(--mono); }
  .label { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
  .muted { color: var(--muted); }
  .soft { color: var(--ink-soft); }
  .num { font-variant-numeric: tabular-nums; }
  .h1 { font-weight: 800; font-size: clamp(32px, 4.4vw, 52px); line-height: 0.98; letter-spacing: -0.045em; margin: 0; text-wrap: balance; }
  .h2 { font-weight: 800; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.05; letter-spacing: -0.035em; margin: 0; text-wrap: balance; }
  .h3 { font-weight: 700; font-size: 17px; letter-spacing: -0.015em; margin: 0; }
  .lede { font-size: 17px; color: var(--ink-soft); max-width: 62ch; margin: 0; }
  .pre { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* ---------- shell */
  .preview-bar { position: relative; z-index: 35; background: var(--accent); color: var(--on-accent); font: 500 12px/1.4 var(--mono); letter-spacing: 0.06em; padding: 8px 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; text-align: center; }
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 18px 18px; border-right: 1px solid var(--line); background: var(--bg); overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-mark { width: 34px; height: 34px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; letter-spacing: -0.04em; font-size: 15px; flex: none; }
  .brand-text { display: grid; line-height: 1.1; }
  .brand-text b { font-weight: 800; letter-spacing: -0.03em; font-size: 16px; }
  .brand-text span { font: 500 10px/1.4 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .side-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mobile-state { display: none; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; border: 0; background: transparent; cursor: pointer; text-align: left; font-weight: 600; font-size: 15px; color: var(--ink-soft); transition: background var(--fast) var(--ease), color var(--fast) var(--ease); white-space: nowrap; }
  .nav-item:hover { background: var(--hover); color: var(--ink); }
  .nav-item.on { background: var(--ink); color: var(--bg); }
  .nav-item .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .nav-item .badge { font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 999px; background: var(--accent); color: var(--on-accent); }
  .nav-item .nav-k { font: 500 10px/1 var(--mono); opacity: 0.5; width: 12px; text-align: right; }
  .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
  .side-toggle { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; transition: border-color var(--fast) var(--ease), color var(--fast) var(--ease); }
  .side-toggle:hover { border-color: var(--ink); color: var(--ink); }
  .side-toggle .ico { width: 16px; height: 16px; transition: transform var(--fast) var(--ease); }
  .state-block .state-title { display: flex; align-items: center; gap: 8px; }
  @media (min-width: 861px) {
    .app { transition: grid-template-columns 320ms var(--ease); }
    .app.collapsed { grid-template-columns: 72px minmax(0, 1fr); }
    .app.collapsed .side { padding: 18px 12px; align-items: center; overflow-x: hidden; }
    .app.collapsed .side-top { flex-direction: column; gap: 12px; }
    .app.collapsed .brand-text, .app.collapsed .nav-label, .app.collapsed .nav-k,
    .app.collapsed .side-links, .app.collapsed .who, .app.collapsed .state-text { display: none; }
    .app.collapsed .nav { width: 100%; }
    .app.collapsed .nav-item { justify-content: center; padding: 11px 0; position: relative; }
    .app.collapsed .nav-item .badge { position: absolute; top: 2px; right: 2px; padding: 3px 5px; font-size: 9.5px; }
    .app.collapsed .side-foot { width: 100%; }
    .app.collapsed .state-block { padding: 12px 0; justify-items: center; }
    .app.collapsed .side-toggle .ico { transform: scaleX(-1); }
  }
  .qtabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-strong); }
  .qtabs button { border: 0; border-right: 1px solid var(--line-strong); background: transparent; padding: 8px 6px; cursor: pointer; font: 500 10.5px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
  .qtabs button:last-child { border-right: 0; }
  .qtabs button.on { background: var(--ink); color: var(--bg); }
  .qtabs button:not(.on):hover { background: var(--hover); }
  .col-head .sub { display: block; font: 400 11px/1.3 var(--font); color: var(--muted); letter-spacing: 0; text-transform: none; margin-top: 3px; }
  @keyframes flash { 0%, 55% { outline-color: var(--accent); } 100% { outline-color: transparent; } }
  .pcard.flash { outline: 2px solid var(--accent); outline-offset: 2px; animation: flash 2.8s var(--ease) forwards; }
  .side-foot { margin-top: auto; display: grid; gap: 14px; }
  .state-block { border: 1px solid var(--line); padding: 12px; display: grid; gap: 6px; background: var(--surface); }
  .state-block strong { font-weight: 800; letter-spacing: -0.02em; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); flex: none; display: inline-block; }
  .dot.test { background: var(--coral); }
  .dot.live { background: var(--good-text); }
  .dot.paused { background: var(--ink); }
  .side-links { display: flex; flex-wrap: wrap; gap: 6px; }
  .who { font: 400 11px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  main { min-width: 0; padding: 34px 44px 110px; }
  main:focus { outline: none; }
  .page { display: grid; gap: 28px; max-width: 1320px; }
  .page-head { display: grid; gap: 12px; }
  .page-head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  /* ---------- controls */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 9px 14px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); font-weight: 600; font-size: 14px; line-height: 1.1; cursor: pointer; border-radius: 0; text-decoration: none; transition: background var(--fast) var(--ease), color var(--fast) var(--ease), border-color var(--fast) var(--ease); white-space: nowrap; }
  .btn:hover { background: var(--ink); color: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .btn.quiet { border-color: var(--line); }
  .btn.quiet:hover { border-color: var(--ink); }
  .btn.small { min-height: 30px; padding: 6px 10px; font-size: 13px; }
  .btn.link { border: 0; padding: 0; min-height: 0; color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
  .btn.link:hover { background: transparent; color: var(--ink); }
  .btn.danger { border-color: var(--warn-text); color: var(--warn-text); }
  .btn.danger:hover, .btn.armed { background: var(--warn-text); color: var(--bg); border-color: var(--warn-text); }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .btn .k { font: 500 10px/1 var(--mono); border: 1px solid currentColor; padding: 2px 4px; opacity: 0.65; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); font: 500 10.5px/1 var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; background: transparent; }
  button.chip { cursor: pointer; }
  button.chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.on, .chip.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.good { background: var(--good-tint); color: var(--good-text); border-color: transparent; }
  .chip.warn { background: var(--warn-tint); color: var(--warn-text); border-color: transparent; }
  .chip.accent { background: var(--accent-tint); color: var(--accent-tint-text); border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  input[type="text"], input[type="email"], input[type="url"], input[type="number"], input[type="search"], input:not([type]), select, textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 9px 11px; font-size: 15px; line-height: 1.45; transition: border-color var(--fast) var(--ease);
  }
  input:hover, select:hover, textarea:hover { border-color: var(--muted); }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: 2px solid var(--focus); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 96px; line-height: 1.55; }
  input[readonly], textarea[readonly] { background: var(--sunken); }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .count { font: 500 11px/1 var(--mono); color: var(--muted); }
  .count.over { color: var(--warn-text); }
  .fields { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .check-line { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .search { max-width: 320px; }

  /* ---------- surfaces */
  .card { border: 1px solid var(--line); background: var(--surface); padding: 22px; display: grid; gap: 16px; min-width: 0; align-content: start; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .hair { display: grid; gap: 1px; padding: 1px; }
  .hair > * { background: var(--surface); outline: 1px solid var(--line); }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }
  .tile { padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; min-width: 0; }
  .tile .v { font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 13px; color: var(--muted); }
  .needs { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .need { border: 0; text-align: left; padding: 20px 20px 18px; display: grid; gap: 10px; cursor: pointer; color: var(--ink); transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
  .need .v { font-weight: 800; font-size: 56px; line-height: 0.9; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  .need .go { font-weight: 600; font-size: 14px; }
  .need:hover { background: var(--ink); color: var(--bg); }
  .need:hover .label, .need:hover .muted { color: inherit; opacity: 0.75; }
  .need.zero .v { color: var(--muted); }
  .empty { padding: 48px 24px; display: grid; gap: 12px; justify-items: start; max-width: 520px; }
  .notice { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface); padding: 14px 16px; display: grid; gap: 6px; }
  .notice.warn { border-left-color: var(--coral); }
  .notice.good { border-left-color: var(--good-text); }

  /* ---------- bars */
  .funnel { display: grid; gap: 4px; }
  .fun-row { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) 52px 70px; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .fun-row:last-child { border-bottom: 0; }
  .fun-row .name { font-size: 14px; font-weight: 600; }
  .fun-row .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fun-row .rate { text-align: right; font: 500 11px/1 var(--mono); color: var(--muted); }
  .bar { height: 10px; background: var(--bar-track); position: relative; min-width: 0; }
  .bar > i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); }
  .bar.thin { height: 6px; }
  .gate { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .gate:last-child { border-bottom: 0; padding-bottom: 0; }
  .gate-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }

  /* ---------- tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font: 500 10.5px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 11px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; background: var(--surface); }
  td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  td .clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 42ch; }
  .rate-cell { display: grid; grid-template-columns: 48px minmax(60px, 1fr); gap: 10px; align-items: center; }
  tr.early td { color: var(--muted); }

  /* ---------- split view (review, replies) */
  .split { display: grid; grid-template-columns: minmax(270px, 340px) minmax(0, 1fr); border: 1px solid var(--line); background: var(--surface); height: calc(100vh - 190px); min-height: 560px; }
  .queue { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .queue-tools { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .queue-tools .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .queue-list { overflow-y: auto; min-height: 0; flex: 1; }
  .q-item { display: grid; gap: 6px; width: 100%; text-align: left; padding: 14px 14px 14px 13px; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; background: transparent; cursor: pointer; color: var(--ink); }
  .q-item:hover { background: var(--hover); }
  .q-item.on { background: var(--accent-tint); border-left-color: var(--accent); }
  .q-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .q-top b { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-group { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); background: var(--sunken); }
  .detail { min-width: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .detail-body { padding: 26px 30px 28px; display: grid; gap: 22px; align-content: start; flex: 1; }
  .actionbar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 30px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; z-index: 2; }
  .actionbar .spacer { flex: 1; }
  .back { display: none; justify-self: start; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-soft); }
  .meta span { display: inline-flex; gap: 6px; align-items: center; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .fact { padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
  .fact .val { font-size: 14px; overflow-wrap: anywhere; }
  .why { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; display: grid; gap: 4px; }
  details.fold { border: 1px solid var(--line); }
  details.fold > summary { cursor: pointer; padding: 12px 14px; list-style: none; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: "+"; font: 500 16px/1 var(--mono); color: var(--muted); }
  details.fold[open] > summary::after { content: "–"; }
  details.fold > .fold-body { padding: 0 14px 14px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs { display: inline-flex; border: 1px solid var(--line-strong); }
  .tabs button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); }
  .tabs button.on { background: var(--ink); color: var(--bg); }
  .mail { border: 1px solid var(--line); background: var(--bg); }
  .mail-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; font-size: 13px; }
  .mail-head div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
  .mail-body { padding: 18px 16px 20px; font-size: 15px; line-height: 1.6; }
  .mail-sig { margin-top: 16px; color: var(--ink-soft); }

<div class="modal" id="help" hidden data-act="close-help"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ================================================================ basics
  var PREVIEW = !!window.__HM_PREVIEW__;
  var main = document.getElementById('main');
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var ROUTES = ['home', 'review', 'replies', 'pipeline', 'leads', 'linkedin', 'waitlist', 'playbook', 'controls'];
  var NAV = { home: 'Today', review: 'Review', replies: 'Replies', pipeline: 'Pipeline', leads: 'Leads', linkedin: 'LinkedIn', waitlist: 'Waitlist', playbook: 'Playbook', controls: 'Controls' };
  var SKIP = { wrong_person: 'Wrong person', size: 'Too big or too small', weak_hook: 'Weak hook', wrong_country: 'Wrong country', not_a_fit: 'Not a fit', other: 'Other' };
  var PB_TYPES = { segment: 'Segment', country: 'Country', angle: 'Angle', writing: 'Writing', contact: 'Contact', example: 'Example', other: 'Other' };
  var STAGE = {
    drafted: 'Drafted', approved: 'Approved', sent_1: 'Email 1 sent', sent_2: 'Follow-up 1 sent', sent_3: 'Follow-up 2 sent',
    finished: 'Finished', replied: 'Replied', bounced: 'Bounced', skipped: 'Skipped', dnc: 'Do not contact',
    demo: 'Demo booked', beta: 'Beta client', won: 'Paying', lost: 'Lost'
  };
  var LABELS = { interested: 'Interested', not_now: 'Not now', wrong_person: 'Wrong person', unsubscribe: 'Unsubscribe', out_of_office: 'Out of office', other: 'Other' };
  var WAIT_STAGES = ['Asked', 'Talked', 'Committed to pay', 'Not a fit'];
  // Two programmes share one Sheet: HireMinds (the product) and Tevrix services (agency work sold through commission agents).
  var PROGS = {
    hireminds: { name: 'HireMinds', btn: 'HireMinds', short: 'HM', sw: 'hm', sub: 'Product · AI interviewer' },
    services: { name: 'Tevrix services', btn: 'Tevrix', short: 'TS', sw: 'ts', sub: 'Agency work · commission agents' }
  };
  var PROG_ROUTES = ['home', 'review', 'replies', 'pipeline', 'leads', 'linkedin'];
  var STAGE_HM = { demo: 'Demo booked', beta: 'Beta client', won: 'Paying' };
  var STAGE_TS = { demo: 'Call booked', beta: 'Agent signed', won: 'Deal closed' };
  var FUNNEL_TS = { found: 'Agents found', demo: 'Call booked', beta: 'Agent signed', won: 'Deal closed' };
  var LI_LIMIT = 300;
  var ICONS = {
    home: '<rect x="3" y="4" width="14" height="13"/><path d="M3 8h14M7 2v4M13 2v4"/>',
    review: '<rect x="3" y="3" width="14" height="14"/><path d="M6.5 10l2.5 2.5 4.5-5"/>',
    replies: '<path d="M8 5L3 10l5 5"/><path d="M3 10h8a6 6 0 0 1 6 6v1"/>',
    pipeline: '<rect x="3" y="3" width="4" height="14"/><rect x="8.5" y="3" width="4" height="10"/><rect x="14" y="3" width="3" height="6"/>',
    leads: '<circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/>',
    linkedin: '<circle cx="8" cy="7" r="3"/><path d="M2.5 17c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M15.5 5v5M13 7.5h5"/>',
    waitlist: '<path d="M7 5h10M7 10h10M7 15h10M3 5h1.5M3 10h1.5M3 15h1.5"/>',
    playbook: '<path d="M4 3.5h8.5A3.5 3.5 0 0 1 16 7v10H7.5A3.5 3.5 0 0 1 4 13.5z"/><path d="M4 13.5A3.5 3.5 0 0 1 7.5 10H16M8 6.5h4"/>',
    controls: '<path d="M3 6h9M16 6h1M3 14h2M9 14h8"/><rect x="12" y="4" width="4" height="4"/><rect x="5" y="12" width="4" height="4"/>'
  };
  function ico(name) { return '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true">' + ICONS[name] + '</svg>'; }

  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function str(v) { return v === null || v === undefined ? '' : String(v); }
  function bool(v) { return v === true || String(v).toUpperCase() === 'TRUE'; }
  function words(s) { s = str(s).trim(); return s ? s.split(/\s+/).length : 0; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function pct(x, digits) { return (x * 100).toFixed(digits === undefined ? 1 : digits).replace(/\.0$/, '') + '%'; }
  function toDate(v) { if (!v) return null; var d = new Date(v); return isNaN(d.getTime()) ? null : d; }
  function addDays(d, n) { return new Date(d.getTime() + n * 864e5); }
  var fmtDay = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  var fmtFull = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  var fmtShort = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });
  function rel(v) {
    var d = toDate(v); if (!d) return '';
    var s = (Date.now() - d.getTime()) / 1000;
    if (s < 0) return fmtDay.format(d);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    if (s < 172800) return 'yesterday';
    if (s < 6 * 86400) return Math.floor(s / 86400) + ' days ago';
    return fmtShort.format(d);
  }
  function full(v) { var d = toDate(v); return d ? fmtFull.format(d) : ''; }
  function day(v) { var d = toDate(v); return d ? fmtDay.format(d) : ''; }
  function msg(e) {
    var m = (e && e.message) || String(e || 'Something went wrong.');
    return m.replace(/^(Exception|Error|ScriptError):\s*/i, '');
  }

  // ================================================================ server calls
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      try {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) { reject(err instanceof Error ? err : new Error(msg(err))); });
        runner[fn].apply(runner, args);
      } catch (e) { reject(e); }
    });
  }

  // ================================================================ state
  var S = null;
  var ui = {
    route: 'home', prog: savedProg(), loading: true, error: null, lastLoad: 0, pending: false, drawer: null, flash: null, logAll: false,
    review: { tab: 'todo', sel: null, q: '', sort: 'score', angle: '', mobile: false, view: 'edit' },
    replies: { sel: null, mobile: false },
    pipe: { q: '', closed: false, view: 'board', needs: false, angle: '', country: '', filters: false, mstage: '', sort: { k: 'next', dir: 1 } },
    leads: { status: 'new', q: '', adding: false },
    li: { filter: 'todo' },
    wait: { adding: false },
    pb: { adding: false, showOld: false },
    skip: null,
    live: { checks: {}, phrase: '' },
    drafts: {}
  };

  function savedProg() { try { var p = localStorage.getItem('tb-prog'); return PROGS[p] ? p : 'hireminds'; } catch (e) { return 'hireminds'; } }
  function progOf(x) {
    if (x && x.prog) return x.prog;
    return x && (x.angle === 'partner' || x.source === 'partner_scan' || x.segment === 'partner') ? 'services' : 'hireminds';
  }
  function mine(x) { return progOf(x) === ui.prog; }
  function isTS() { return ui.prog === 'services'; }
  // Rows and numbers for the programme picked in the sidebar.
  function OUT() { return S ? S.outreach.filter(mine) : []; }
  function LEADS() { return S ? S.leads.filter(mine) : []; }
  function LI() { return S ? S.linkedin.filter(mine) : []; }
  var SHARED_LOG = ['pause', 'resume', 'setting', 'test_email', 'cap_reached', 'send_blocked', 'bounce_pause', 'install_triggers', 'dnc_add'];
  function LOGS() {
    if (!S) return [];
    return S.log.filter(function (r) {
      if (r.prog) return r.prog === ui.prog;
      return !isTS() || SHARED_LOG.indexOf(str(r.action)) !== -1;
    });
  }
  function M(p) { return S ? ((S.metricsBy && S.metricsBy[p || ui.prog]) || S.metrics) : {}; }
  function applyProgLabels() {
    var L = isTS() ? STAGE_TS : STAGE_HM;
    Object.keys(L).forEach(function (k) { STAGE[k] = L[k]; COL_NAME[k] = L[k]; });
  }
  function setProg(p) {
    if (!PROGS[p] || p === ui.prog) return;
    ui.prog = p;
    try { localStorage.setItem('tb-prog', p); } catch (e) {}
    document.documentElement.setAttribute('data-prog', p);
    applyProgLabels();
    ui.review.sel = null; ui.review.angle = ''; ui.replies.sel = null;
    ui.pipe.angle = ''; ui.pipe.country = ''; ui.pipe.mstage = '';
    ui.leads.status = p === 'services' ? 'all' : 'new'; ui.leads.adding = false;
    closeDrawer();
    render(true);
    toast('Showing ' + PROGS[p].name);
  }
  function progTag() { var P = PROGS[ui.prog]; return '<span class="prog-tag"><i class="sw ' + P.sw + '" aria-hidden="true"></i>' + esc(P.name) + '</span>'; }

  function byId(id) {
    if (!S) return null;
    for (var i = 0; i < S.outreach.length; i++) if (String(S.outreach[i].lead_id) === String(id)) return S.outreach[i];
    return null;
  }
  function leadOf(id) {
    if (!S) return null;
    for (var i = 0; i < S.leads.length; i++) if (String(S.leads[i].lead_id) === String(id)) return S.leads[i];
    return null;
  }
  function upsert(row, quiet) {
    var i = -1;
    S.outreach.forEach(function (o, k) { if (String(o.lead_id) === String(row.lead_id)) i = k; });
    if (i >= 0) S.outreach[i] = row; else S.outreach.push(row);
    if (!quiet) render();
  }
  function setting(k) { return S && S.settings ? S.settings[k] : ''; }
  function mailboxes() { return str(setting('MAILBOXES')).split(',').map(function (s) { return s.trim(); }).filter(Boolean); }
  function sendState() {
    if (bool(setting('SENDING_PAUSED'))) return { key: 'paused', title: 'Paused', sub: 'Nothing goes out until you resume.' };
    if (bool(setting('TEST_MODE'))) return { key: 'test', title: 'Test mode', sub: 'Every email goes to ' + (str(setting('TEST_RECIPIENT')) || 'the test inbox') + '.' };
    return { key: 'live', title: 'Live', sub: 'Approved emails go to real people.' };
  }
  function dailyCap() { return (Number(setting('DAILY_CAP_PER_MAILBOX')) || 0) * Math.max(1, mailboxes().length); }

  function draftsAll() { return OUT().filter(function (o) { return (!o.stage || o.stage === 'drafted') && !o.decision; }); }
  function approvedAll() { return OUT().filter(function (o) { return o.stage === 'approved'; }); }
  function repliesOpen() {
    return OUT().filter(function (o) { return o.stage === 'replied' && !o.reply_sent_at; })
      .sort(function (a, b) { return str(b.replied_at).localeCompare(str(a.replied_at)); });
  }
  function repliesDone() {
    return OUT().filter(function (o) { return o.reply_sent_at || (o.replied_at && o.stage !== 'replied'); })
      .sort(function (a, b) { return str(b.replied_at).localeCompare(str(a.replied_at)); }).slice(0, 30);
  }
  function reviewQueue() {
    var q = ui.review.q.trim().toLowerCase();
    var list = draftsAll().filter(function (o) {
      if (ui.review.angle && o.angle !== ui.review.angle) return false;
      if (!q) return true;
      return [o.company, o.country, o.contact_name, o.contact_title, o.angle].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    list.sort(function (a, b) {
      if (ui.review.sort === 'country') return str(a.country).localeCompare(str(b.country)) || (Number(b.score) || 0) - (Number(a.score) || 0);
      return (Number(b.score) || 0) - (Number(a.score) || 0) || str(a.company).localeCompare(str(b.company));
    });
    return list;
  }
  function counts() {
    if (!S) return {};
    return { review: draftsAll().length, replies: repliesOpen().length, linkedin: M().linkedinToSend, leads: M().leadsNew,
      playbook: (S.playbook || []).filter(function (r) { return r.status === 'proposed'; }).length };
  }

  // Unsaved edits live here until saved, so a refresh never loses typing.
  function dv(o, f) {
    var d = ui.drafts[o.lead_id];
    return d && Object.prototype.hasOwnProperty.call(d, f) ? d[f] : str(o[f]);
  }
  function editsFor(o, fields) {
    var d = ui.drafts[o.lead_id], out = {}, any = false;
    if (!d) return null;
    Object.keys(d).forEach(function (k) {
      if (fields && fields.indexOf(k) === -1) return;
      if (d[k] !== str(o[k])) { out[k] = d[k]; any = true; }
    });
    return any ? out : null;
  }
  function isDirty(o, fields) { return !!(o && editsFor(o, fields)); }

  // ================================================================ load and render
  function load(quiet) {
    if (!quiet && !S) { ui.loading = true; render(); }
    return call('uiGetState').then(function (d) {
      S = d; ui.loading = false; ui.error = null; ui.lastLoad = Date.now();
      render();
    }).catch(function (e) {
      ui.loading = false;
      if (!S) { ui.error = msg(e); render(); } else toast(msg(e), { err: true });
    });
  }
  var softTimer = null;
  function softRefresh() { clearTimeout(softTimer); softTimer = setTimeout(function () { load(true); }, 1400); }

  function typing() {
    var a = document.activeElement;
    return !!(a && main.contains(a) && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox' && a.type !== 'button')));
  }
  function render(force) {
    renderNav(); renderSide();
    if (!force && typing()) { ui.pending = true; return; }
    ui.pending = false;
    var keep = {};
    $$('[data-keep]', main).forEach(function (el) { keep[el.getAttribute('data-keep')] = el.scrollTop; });
    var html;
    if (ui.error) html = errorView();
    else if (ui.loading || !S) html = loadingView();
    else html = SCREENS[ui.route]();
    main.innerHTML = html;
    $$('[data-keep]', main).forEach(function (el) {
      var k = el.getAttribute('data-keep');
      if (keep[k] !== undefined) el.scrollTop = keep[k];
    });
    $$('textarea[data-auto]', main).forEach(autosize);
    if (!isDesktop()) { var sd = $('.side'); if (sd) document.documentElement.style.setProperty('--mhead', sd.offsetHeight + 'px'); }
    var sc = $('.stage-chip.on', main), strip = sc && sc.parentNode;
    if (sc && strip.scrollWidth > strip.clientWidth) {
      var l = sc.offsetLeft - strip.offsetLeft, r = l + sc.offsetWidth;
      if (l < strip.scrollLeft + 16) strip.scrollLeft = Math.max(0, l - 24);
      else if (r > strip.scrollLeft + strip.clientWidth - 16) strip.scrollLeft = r - strip.clientWidth + 24;
    }
    var on = $('.q-item.on', main), ql = on && on.closest('.queue-list');
    if (on && ql && isDesktop()) {
      var r = on.getBoundingClientRect(), qr = ql.getBoundingClientRect();
      if (r.top < qr.top) ql.scrollTop -= qr.top - r.top;
      else if (r.bottom > qr.bottom) ql.scrollTop += r.bottom - qr.bottom;
    }
  }
  function autosize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

  function renderProg() {
    var box = $('#prog');
    if (!box) return;
    box.innerHTML = '<div class="prog-seg" role="group" aria-label="Programme">' + Object.keys(PROGS).map(function (p) {
      var P = PROGS[p], mp = M(p), n = S ? (mp.drafts || 0) + (mp.repliesWaiting || 0) : 0, on = ui.prog === p;
      return '<button data-act="prog" data-v="' + p + '" class="' + (on ? 'on' : '') + '" aria-pressed="' + on + '" title="' + esc(P.name + ' · ' + P.sub + (n ? ' · ' + n + ' waiting' : '') + '  (P)') + '">' +
        '<i class="sw ' + P.sw + '" aria-hidden="true"></i><span class="pn">' + esc(P.name) + '</span><span class="ps" aria-hidden="true">' + P.short + '</span>' +
        (n ? '<span class="pc num" aria-label="' + n + ' waiting">' + n + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  }
  function renderNav() {
    renderProg();
    var c = counts();
    $('#nav').innerHTML = ROUTES.map(function (r, i) {
      var n = c[r];
      return '<button class="nav-item' + (ui.route === r ? ' on' : '') + '" data-act="go" data-to="' + r + '" title="' + NAV[r] + (n ? ' · ' + n + ' waiting' : '') + '  (' + (i + 1) + ')"' + (ui.route === r ? ' aria-current="page"' : '') + '>' +
        ico(r) + '<span class="nav-label">' + NAV[r] + '</span>' + (n ? '<span class="badge num" aria-label="' + n + ' waiting">' + n + '</span>' : '') +
        '<span class="nav-k" aria-hidden="true">' + (i + 1) + '</span></button>';
    }).join('');
    var nav = $('#nav'), on = $('.nav-item.on', nav);
    if (on && nav.scrollWidth > nav.clientWidth) {
      var l = on.offsetLeft - nav.offsetLeft, r = l + on.offsetWidth;
      if (l < nav.scrollLeft + 16) nav.scrollLeft = Math.max(0, l - 32);
      else if (r > nav.scrollLeft + nav.clientWidth - 16) nav.scrollLeft = r - nav.clientWidth + 32;
    }
  }
  function renderSide() {
    var foot = $('#sideFoot'), mob = $('#mobileState');
    if (!S) { foot.innerHTML = ''; mob.innerHTML = ''; return; }
    var st = sendState();
    mob.innerHTML = '<button class="chip" data-act="go" data-to="controls"><span class="dot ' + st.key + '"></span>' + esc(st.title) + '</button>';
    foot.innerHTML =
      '<button class="state-block" data-act="go" data-to="controls" title="Sending: ' + esc(st.title) + '. ' + esc(st.sub) + '" style="text-align:left;cursor:pointer;color:var(--ink)">' +
        '<span class="label state-text">Sending</span><strong class="state-title"><span class="dot ' + st.key + '"></span><span class="state-text">' + esc(st.title) + '</span></strong>' +
        '<span class="muted state-text" style="font-size:13px">' + esc(st.sub) + '</span></button>' +
      '<div class="side-links">' +
        '<button class="btn quiet small" data-act="refresh" title="Refresh (R)">Refresh</button>' +
        '<button class="btn quiet small" data-act="theme" title="Switch theme">' + themeLabel() + ' theme</button>' +
        '<button class="btn quiet small" data-act="help" title="Keyboard shortcuts (?)">Shortcuts</button>' +
        (S.sheetUrl ? '<a class="btn quiet small" href="' + esc(S.sheetUrl) + '" target="_blank" rel="noopener">Sheet ↗</a>' : '') +
      '</div>' +
      '<div class="who">' + esc(S.me) + '<br>Updated ' + esc(rel(new Date(ui.lastLoad).toISOString())) + '</div>';
  }

  function loadingView() {
    return '<div class="page"><div class="page-head"><div class="skel" style="width:140px"></div><div class="skel" style="height:48px;width:min(420px,80%)"></div></div>' +
      '<div class="hair needs">' + [1, 2, 3, 4].map(function () { return '<div class="need"><div class="skel" style="height:44px;width:60px"></div><div class="skel" style="width:70%"></div></div>'; }).join('') + '</div>' +
      '<div class="skel" style="height:240px"></div></div>';
  }
  function errorView() {
    return '<div class="page"><div class="empty"><span class="label">Could not load</span><h1 class="h2">The console could not read the Sheet.</h1>' +
      '<p class="soft">' + esc(ui.error) + '</p><button class="btn primary" data-act="retry">Try again</button></div></div>';
  }

  function head(eyebrow, title, lede, right) {
    if (PROG_ROUTES.indexOf(ui.route) !== -1) eyebrow = (eyebrow ? eyebrow + ' · ' : '') + progTag();
    return '<header class="page-head"><div class="page-head-row"><div style="display:grid;gap:12px;min-width:0">' +
      (eyebrow ? '<span class="label">' + eyebrow + '</span>' : '') + '<h1 class="h1">' + title + '</h1></div>' + (right || '') + '</div>' +
      (lede ? '<p class="lede">' + lede + '</p>' : '') + '</header>';
  }
  function emailChip(s) {
    s = str(s).toLowerCase();
    if (s === 'safe') return '<span class="chip good">Email safe</span>';
    if (!s) return '<span class="chip">Email not checked</span>';
    return '<span class="chip warn">Email ' + esc(s) + '</span>';
  }
  function stageChip(st) {
    var cls = { replied: 'accent', demo: 'good', beta: 'good', won: 'good', bounced: 'warn', dnc: 'warn', lost: '' }[st] || '';
    return '<span class="chip ' + cls + '">' + esc(STAGE[st] || st || 'Drafted') + '</span>';
  }
  function labelChip(l) {
    if (!l) return '';
    var cls = { interested: 'good', unsubscribe: 'warn', not_now: '', wrong_person: '', out_of_office: '', other: '' }[l] || '';
    return '<span class="chip ' + cls + '">' + esc(LABELS[l] || l) + '</span>';
  }
  function firstName(email) {
    var local = str(email).split('@')[0].split(/[._-]/)[0];
    if (!local || local.length > 12 || /^(team|bd|sales|hello|info|admin|ops|marketing|founders?|business|contact|support|office|hr|careers|tevrixmarketing)$/i.test(local)) return '';
    return local.charAt(0).toUpperCase() + local.slice(1);
  }
  function nextStep(o) {
    var s1 = toDate(o.sent_1_at);
    if (!s1) return '';
    if (o.stage === 'sent_1') return 'Follow-up 1 on ' + day(addDays(s1, Number(setting('FOLLOWUP_1_AFTER_DAYS')) || 4));
    if (o.stage === 'sent_2') return 'Follow-up 2 on ' + day(addDays(s1, Number(setting('FOLLOWUP_2_AFTER_DAYS')) || 10));
    if (o.stage === 'sent_3') return 'Finishes on ' + day(addDays(s1, Number(setting('FINISH_AFTER_DAYS')) || 15));
    return '';
  }

  // ================================================================ screen: today
  function homeView() {
    var m = M(), st = sendState(), c = counts(), ts = isTS();
    var hour = new Date().getHours();
    var hello = (hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening');
    var name = firstName(S.me);
    var waiting = [];
    if (c.review) waiting.push(plural(c.review, 'draft'));
    if (c.replies) waiting.push(plural(c.replies, 'reply', 'replies'));
    if (c.linkedin) waiting.push(plural(c.linkedin, 'LinkedIn request'));
    var lede = (ts ? 'Tevrix services: commission agents who bring you AI, website and automation clients. ' : 'HireMinds: outreach for the AI interviewer. ') +
      (waiting.length ? waiting.join(', ').replace(/, ([^,]*)$/, ' and $1') + ' need you. ' : 'Nothing needs you right now. ') +
      (st.key === 'test' ? 'Sending is in test mode, so nothing reaches real people yet.' : st.key === 'paused' ? 'Sending is paused.' : 'Sending is live.');

    var needs = [
      ['review', c.review, 'Drafts to review', ts ? 'Approve or skip Claude\'s emails to agents' : 'Approve or skip what Claude wrote'],

  // ---- charts on Today: one small bar chart per measure, one bar per day, in the programme's colour
  function dayName(d) { return d ? day(d + 'T12:00:00') : ''; }
  function sparkSvg(series, key, noun) {
    var W = 280, H = 84, n = series.length || 1, slot = W / n, bw = Math.max(4, slot - 6);
    var max = Math.max.apply(null, series.map(function (d) { return d[key] || 0; }).concat([1]));
    var bars = series.map(function (d, i) {
      var v = d[key] || 0, x = +(i * slot + (slot - bw) / 2).toFixed(2), h = v ? Math.max(3, v / max * (H - 6)) : 0, y = +(H - h).toFixed(2);
      var r = Math.min(4, bw / 2, h);
      var mark = v
        ? '<path class="bar" d="M' + x + ' ' + H + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'H' + (x + bw - r) + 'Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + r) + 'V' + H + 'Z"/>'
        : '<rect class="zero" x="' + x + '" y="' + (H - 2) + '" width="' + bw + '" height="2"/>';
      var tip = dayName(d.day) + ': ' + plural(v, noun[0], noun[1]);
      return '<g class="d" tabindex="0" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '"><title>' + esc(tip) + '</title>' +
        '<rect class="hit" x="' + (i * slot).toFixed(2) + '" y="0" width="' + slot.toFixed(2) + '" height="' + H + '"/>' + mark + '</g>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="false" role="group">' + bars +
      '<line class="base" x1="0" y1="' + H + '" x2="' + W + '" y2="' + H + '"/></svg>';
  }
  function spark(title, series, key, noun) {
    var total = 0, best = null;
    series.forEach(function (d) { var v = d[key] || 0; total += v; if (v && (!best || v >= best[key])) best = d; });
    var dflt = total ? 'Busiest: ' + dayName(best.day) + ' · ' + best[key] : 'None in the last 14 days';
    var table = '<table class="vh"><caption>' + esc(title) + ', last 14 days</caption><tbody>' +
      series.map(function (d) { return '<tr><th scope="row">' + esc(dayName(d.day)) + '</th><td>' + (d[key] || 0) + '</td></tr>'; }).join('') + '</tbody></table>';
    return '<div class="spark"><div class="spark-top"><span class="label">' + esc(title) + '</span><span class="v">' + total + '</span></div>' +
      sparkSvg(series, key, noun) +
      '<div class="spark-axis" aria-hidden="true"><span>' + esc(dayName(series[0] && series[0].day)) + '</span><span>Today</span></div>' +
      '<div class="spark-tip" aria-live="polite" data-default="' + esc(dflt) + '">' + esc(dflt) + '</div>' + table + '</div>';
  }

  // ================================================================ screen: pipeline
  var PRICE_USD = 250;

  var COL_NAME = { approved: 'Approved', sent_1: 'Email 1 sent', sent_2: 'Follow-up 1 sent', sent_3: 'Follow-up 2 sent', replied: 'Replied', demo: 'Demo booked', beta: 'Beta client', won: 'Paying' };
  var ORDER = { approved: 1, sent_1: 2, sent_2: 3, sent_3: 4, replied: 5, demo: 6, beta: 7, won: 8, finished: 9, lost: 10, bounced: 11, skipped: 12, dnc: 13 };

  function daysSince(v) { var d = toDate(v); return d ? (Date.now() - d.getTime()) / 864e5 : null; }
  function lastTouch(o) {
    return [o.stage_at, o.reply_sent_at, o.replied_at, o.bounced_at, o.sent_3_at, o.sent_2_at, o.sent_1_at, o.decided_at]
      .filter(Boolean).sort().pop() || '';

  function ago(days) { return days < 1 / 24 ? 'under 1 h' : days < 1 ? Math.floor(days * 24) + ' h' : Math.floor(days) + ' d'; }
  // What happens next for a lead in the automatic sequence, and when.
  function nextInfo(o) {
    if (o.stage === 'approved') {
      var age = daysSince(o.decided_at) || 0;
      return { text: age > 1 ? 'Not sent yet · ' + ago(age) : 'Sends next run', late: age > 1, due: toDate(o.decided_at) };
    }
    var s1 = toDate(o.sent_1_at);
    var steps = { sent_1: ['Follow-up 1', 'FOLLOWUP_1_AFTER_DAYS', 4], sent_2: ['Follow-up 2', 'FOLLOWUP_2_AFTER_DAYS', 10], sent_3: ['Finishes', 'FINISH_AFTER_DAYS', 15] };
    var st = steps[o.stage];
    if (!s1 || !st) return null;
    var due = addDays(s1, Number(setting(st[1])) || st[2]);
    var diff = (due.getTime() - Date.now()) / 864e5;
    var when = diff < -2 ? 'overdue ' + Math.floor(-diff) + ' d' : diff < 0 ? 'due now' : diff < 1 ? 'today' : diff < 2 ? 'tomorrow' : day(due);
    return { text: st[0] + ' ' + when, late: diff < -2, due: due };
  }
  // Anything on a card that is waiting on a founder, or looks stuck.
  function attention(o) {
    if (o.stage === 'replied' && !o.reply_sent_at && o.reply_decision !== 'send') {
      var d = daysSince(o.replied_at) || 0;
      return { kind: 'reply', text: 'Waiting on you · ' + ago(d), urgent: d >= 1 };
    }
    if (o.stage === 'demo' || o.stage === 'beta') {
      var q = daysSince(lastTouch(o));
      if (q !== null && q >= 10) return { kind: 'stale', text: 'No update · ' + Math.floor(q) + ' d', urgent: true };
    }
    var n = nextInfo(o);

    return null;

  function statusLine(o) {

  function sortCol(stage, list) {

    return list.slice().sort(by[stage] || seq);
