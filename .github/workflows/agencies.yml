# Weekly recruitment/staffing agency intake from Google Maps (gosom/google-maps-scraper in Docker).
# Started by the Apps Script on AGENCIES_DAY at 01:00 IST through the workflow_dispatch API.
name: agencies

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Sheet writes)"
        type: boolean
        default: false
      limit:
        description: "Max new leads (blank = config default)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write   # lets the run prove to Google it is this repo (no key stored anywhere)

concurrency:
  group: bd-agencies
  cancel-in-progress: false

jobs:
  agencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: astral-sh/setup-uv@v6
      - name: Install ColdReach and theHarvester (optional email finders)
        continue-on-error: true
        env:
          THEHARVESTER_REF: master   # pin to a release tag or commit once you have tested one
        run: |
          pipx install "coldreach==0.1.0"
          git clone --depth 1 --branch "$THEHARVESTER_REF" https://github.com/laramies/theHarvester.git "$RUNNER_TEMP/theHarvester"
          (cd "$RUNNER_TEMP/theHarvester" && uv sync)
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec uv run --project "%s" theHarvester "$@"\n' "$RUNNER_TEMP/theHarvester" > "$HOME/.local/bin/theHarvester"
          chmod +x "$HOME/.local/bin/theHarvester"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/theHarvester" -h | head -3 || true
          coldreach --version || true
      - name: Build the Maps queries
        run: python -m bd.main maps-queries --out queries.txt
      - name: Scrape Google Maps
        run: |
          touch results.csv
          docker run --rm -v "$PWD/queries.txt:/queries" -v "$PWD/results.csv:/results.csv" \
            gosom/google-maps-scraper -input /queries -results /results.csv \
            -depth 1 -email -exit-on-inactivity 3m
          echo "rows: $(($(wc -l < results.csv) - 1))"
      - name: Sign in to Google (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/753658526719/locations/global/workloadIdentityPools/github/providers/github
          service_account: tevrix-bd-bot@tevrix-bd.iam.gserviceaccount.com
      - name: Write agency leads
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args="maps results.csv"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ -n "$LIMIT" ] && args="$args --limit $LIMIT"
          python -m bd.main $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agencies-${{ github.run_id }}
          path: |
            results.csv
            out/*.csv
          if-no-files-found: ignore
          retention-days: 14
