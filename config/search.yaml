agency_keywords: [recruit, staffing, talent, resourcing, personnel, employment agency, headhunt, workforce,
  placement, manpower, hr consult, hr solution, hr service]

# Google Maps agency intake (gosom/google-maps-scraper). One line per query.
maps:
  categories: [recruitment agency, staffing agency]
  cities:
    - {city: London,     country: UK}
    - {city: Manchester, country: UK}
    - {city: Birmingham, country: UK}
    - {city: Dublin,     country: Ireland}
    - {city: Dubai,      country: UAE}
    - {city: Abu Dhabi,  country: UAE}
    - {city: Singapore,  country: Singapore}
    - {city: Sydney,     country: Australia}
    - {city: Melbourne,  country: Australia}
    - {city: Auckland,   country: New Zealand}
    # India: placement consultancies place BPO, sales, retail and logistics staff in bulk.
    # Overseas recruitment agencies (Gulf jobs) screen thousands of candidates per employer demand.
    - {city: Delhi,     country: India, categories: [placement consultancy, staffing agency, overseas recruitment agency]}
    - {city: Gurugram,  country: India, categories: [placement consultancy, staffing agency]}
    - {city: Noida,     country: India, categories: [placement consultancy, staffing agency]}
    - {city: Mumbai,    country: India, categories: [placement consultancy, staffing agency, overseas recruitment agency]}
    - {city: Pune,      country: India, categories: [placement consultancy, staffing agency]}
    - {city: Bengaluru, country: India, categories: [placement consultancy, staffing agency]}
    - {city: Hyderabad, country: India, categories: [placement consultancy, staffing agency, overseas recruitment agency]}
    - {city: Chennai,   country: India, categories: [placement consultancy, staffing agency]}
    - {city: Kolkata,   country: India, categories: [placement consultancy, staffing agency]}
    - {city: Ahmedabad, country: India, categories: [placement consultancy, staffing agency]}
    - {city: Kochi,     country: India, categories: [overseas recruitment agency]}
  max_new_leads_per_run: 80
  max_per_country: 25

# Startup sources (beta-customer segment): YC hiring list and Hacker News "Who is hiring?".
startups:
  yc: true
  hacker_news: true
  team_min: 15
  team_max: 200
  max_new_leads_per_run: 15

# Look up a company's own website when the job board gives none (web search, no API key).
websites:
  enabled: true
  max_lookups_per_run: 80
  pause_seconds: [1.5, 3.0]

contacts:
  user_agent: "TevrixBDBot/1.0 (+https://hireminds.tevrixai.com)"
  timeout_seconds: 12
  max_pages: 6
  page_keywords: [about, team, people, leadership, company, contact, careers]

# Extra email finders, used only when the website crawl found no published or pattern-confirmed address.
osint:
  enabled: true
  coldreach_cmd: [coldreach]          # pipx install coldreach (MIT). Always run with --quick --no-reacher (no port 25)
  coldreach_timeout: 60
  harvester_enabled: false           # timed out on every domain in the 9 Nov test; switch on to retry
  harvester_cmd: [theHarvester]       # wrapper installed by the workflow (uv + the GitHub repo, Python 3.14)
  harvester_sources: duckduckgo,yahoo,mojeek,commoncrawl,urlscan,otx   # no API keys needed
  harvester_timeout: 60
  max_domains_per_run: 20
  budget_minutes: 10                  # total per run: GitHub Free gives private repos 2,000 minutes a month

verify:
  apify_actor: pnda~email-finder   # keep the actor ID here; it is new and may move
  batch_size: 10                   # first 10 persons per run are free on the free plan
