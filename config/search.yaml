# tevrix-bd search configuration. Edit freely; the code reads everything from here.

# The Google Sheet "HireMinds BD — Outreach" (not secret: only accounts it is shared with can open it).
sheet_id: 1cDZcswzXjaxnZSlheKE-OulPlAy2Yzj3sPAlrv-qM7k

# Wave 1 markets. country_indeed must be the exact name JobSpy expects.
# Boards JobSpy supports: indeed, linkedin, bayt, google, glassdoor, zip_recruiter, naukri.
#   indeed    most reliable, no rate limit; gives company size and revenue
#   linkedin  starts rate-limiting around page 10 per IP; no login used
#   bayt      Gulf coverage (UAE)
#   google    Google Jobs; add it to a country's boards to try it (uses location below)
#   glassdoor, zip_recruiter  left off: frequent 400/403 errors in 2026 tests; zip_recruiter is US/Canada only
#   naukri    India only (searches all of India unless naukri_location is set)
countries:
  - {code: UK,  country_indeed: UK,                     linkedin_location: United Kingdom,       boards: [indeed, linkedin]}
  - {code: IE,  country_indeed: Ireland,                linkedin_location: Ireland,              boards: [indeed, linkedin]}
  - {code: AE,  country_indeed: United Arab Emirates,   linkedin_location: United Arab Emirates, boards: [indeed, linkedin, bayt]}
  - {code: SG,  country_indeed: Singapore,              linkedin_location: Singapore,            boards: [indeed, linkedin]}
  - {code: AU,  country_indeed: Australia,              linkedin_location: Australia,            boards: [indeed, linkedin]}
  - {code: NZ,  country_indeed: New Zealand,            linkedin_location: New Zealand,          boards: [indeed, linkedin]}
  # Wave 2 (uncomment when US sending is ready: POSTAL_ADDRESS must be filled):
  # - {code: US, country_indeed: USA,    linkedin_location: United States, boards: [indeed, linkedin]}
  # - {code: CA, country_indeed: Canada, linkedin_location: Canada,        boards: [indeed, linkedin]}
  # India (from 9 Nov 2026): the AI interviewer runs in Hinglish. Own search terms below (search_terms.by_country).
  # LinkedIn left out for India: Naukri and Indeed cover it, and LinkedIn blocked 9 of 17 India searches
  # in the 9 Nov test (it also costs the most GitHub minutes). Founders' LinkedIn outreach is unaffected.
  - {code: IN,  country_indeed: India,                  linkedin_location: India,                boards: [naukri, indeed]}

# The country label written to the Sheet (matches the Apps Script time-zone table).
country_labels:
  UK: UK
  IE: Ireland
  AE: UAE
  SG: Singapore
  AU: Australia
  NZ: New Zealand
  US: United States
  CA: Canada
  IN: India

search_terms:
  high_intent:        # one of these alone is enough to keep a company
    - talent acquisition
    - recruiter
    - HR manager
    - people operations
  volume:             # need 3+ roles in 7 days
    - sales executive
    - customer service
    - account manager
    - care assistant
    - retail assistant
    - warehouse operative
    - hospitality
  by_country:         # replaces the volume list above for that country
    IN:
      - telecaller
      - customer support executive
      - voice process
      - BPO
      - field sales executive
      - relationship manager
      - business development executive
      - inside sales
      - walk-in interview
      - delivery executive
      - retail sales associate
      - machine operator
      - staff nurse

jobspy:
  hours_old: 168
  results_wanted: 35        # 30-40 per search
  pause_seconds: [3, 6]     # random pause between calls
  linkedin_fetch_description: false

filters:
  min_roles: 3
  agency_min_roles: 2
  # A role counts as "volume" when its title starts a word with one of these.
  volume_keywords: [sales, customer, support, service, advisor, adviser, account manager, account executive,
    business development, representative, telesales, call centre, contact centre, collections, care, carer,
    nurse, healthcare assistant, support worker, warehouse, operative, picker, packer, driver, delivery,
    courier, retail, store, shop, cashier, barista, waiter, waitress, bartender, chef, cook, kitchen,
    housekeep, cleaner, cleaning, security, receptionist, front desk, hospitality, crew, team member,
    fitness, trainer, membership, attendant, recruitment consultant,
    telecaller, telecalling, tele sales, tele-sales, voice process, bpo, relationship manager, relationship officer,
    field sales, field executive, field officer, counsellor, counselor, process associate, agent, operator,
    technician, trainee, data entry, fresher, walk-in, walk in, loan, promoter, nursing]
  size_min: 20
  size_max: 500
  max_new_leads_per_run: 40
  max_per_country: 12          # room for every market each night
  country_overrides:
    IN: {size_max: 5000, max_leads: 20}   # India: BPOs and BFSI sales teams of 500-5,000 staff hire in bulk
  # Companies never to add (lower-case substrings of the name or domain).
  exclude:
    - tevrix
    - hireminds
    - amazon
    - google
    - microsoft
    - deloitte
    - pwc
    - kpmg
    - ernst & young
    - accenture
    - nhs
    - government
    - council
    - ministry
    - university
    # Big tech and executive search: low applicant volume per role, own systems
    - executive search
    - datadog
    - figma
    - anthropic
    - openai
    - salesforce
    - stripe
    - atlassian
    - canva
    - revolut
    - monzo
    - deliveroo
    - uber
    - airbnb
    - oracle
    - ibm
    # Very large agencies: long buying cycles, global tooling
    - michael page
    - page group
    - pagegroup
    - reed
    - hays
    - robert half
    - adecco
    - randstad
    - manpowergroup
    - manpower group
    - manpower uk
